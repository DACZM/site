<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DACHUB</title>
<link rel="shortcut icon" href="https://i.pinimg.com/736x/e8/1b/61/e81b61376f47ce514b479dd6c251f336.jpg" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060608;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --text: #f0f0f0;
  --muted: #666;
  --dim: #333;
  --accent: #a855f7;
  --accent2: #c084fc;
  --accent3: #7c3aed;
  --sidebar-w: 220px;
  --header-h: 56px;
  --r: 6px;
  --font: 'Syne', sans-serif;
  --mono: 'Space Mono', monospace;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

.bg-overlay {
  position: fixed; inset: 0;
  background: rgba(6,6,8,0.88);
  z-index: 0;
  pointer-events: none;
}

/* PARTICLES */
#particles-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; opacity: 0.4;
}

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w);
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(20px);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  flex-shrink: 0;
  z-index: 20;
  position: relative;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.brand-logo {
  width: 28px; height: 28px;
  border-radius: 4px;
  object-fit: cover;
}

.brand-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.12em;
  color: var(--accent);
  text-transform: uppercase;
}

.brand-ver {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  margin-left: auto;
  background: var(--surface);
  padding: 2px 5px;
  border-radius: 3px;
}

.nav-section {
  padding: 8px 0;
}

.nav-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
  padding: 4px 20px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 20px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
  user-select: none;
}

.nav-item:hover { color: var(--text); background: var(--surface); }

.nav-item.active {
  color: var(--accent);
  background: rgba(168,85,247,0.08);
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
  background: var(--accent);
}

.nav-icon {
  width: 16px; height: 16px;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  flex-shrink: 0;
}

.nav-badge {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 9px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 1px 5px;
  border-radius: 10px;
}

.nav-item.active .nav-badge {
  background: rgba(168,85,247,0.15);
  border-color: rgba(168,85,247,0.35);
  color: var(--accent);
}

/* INSTAGRAM LINK */
.nav-item.ig:hover, a.nav-item:hover { color: var(--text); background: var(--surface); }
a.nav-item { color: var(--muted); }


.sidebar-bottom {
  margin-top: auto;
  padding: 12px 20px;
  border-top: 1px solid var(--border);
}

.sidebar-stats {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--dim);
  line-height: 1.8;
}

.sidebar-stats span { color: var(--muted); }

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  position: relative;
  z-index: 5;
}

/* HEADER */
header {
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  background: rgba(6,6,8,0.7);
  backdrop-filter: blur(16px);
  gap: 12px;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.page-title {
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  white-space: nowrap;
}

.count-badge {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

/* SEARCH */
.search-wrap {
  position: relative;
  width: 220px;
}

.search-icon-el {
  position: absolute;
  left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 13px; height: 13px;
  stroke: var(--muted);
  stroke-width: 1.5;
  fill: none;
  pointer-events: none;
}

.search-shortcut {
  position: absolute;
  right: 8px; top: 50%;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 9px;
  color: var(--dim);
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 1px 4px;
  border-radius: 3px;
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 12px;
  padding: 7px 32px 7px 30px;
  border-radius: var(--r);
  outline: none;
  transition: all 0.2s;
}

.search-input:focus {
  border-color: var(--accent);
  background: rgba(168,85,247,0.04);
  box-shadow: 0 0 0 2px rgba(168,85,247,0.1);
}

.search-input::placeholder { color: var(--dim); }

/* SUGGESTIONS */
.search-suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: #0e0e10;
  border: 1px solid var(--border-hover);
  border-radius: var(--r);
  overflow: hidden;
  z-index: 100;
  display: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

.search-suggestions.visible { display: block; }

.suggestion-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.1s;
}

.suggestion-item:hover { background: var(--surface); }
.suggestion-item img { width: 14px; height: 14px; border-radius: 2px; }
.suggestion-name { font-weight: 600; }
.suggestion-cat {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
}

/* HEADER BUTTONS */
.hbtn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-family: var(--font);
  font-weight: 600;
  padding: 6px 10px;
  border-radius: var(--r);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
  white-space: nowrap;
  text-decoration: none;
}

.hbtn:hover {
  color: var(--text);
  border-color: var(--border-hover);
  background: var(--surface-hover);
}

.hbtn svg { width: 13px; height: 13px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.hbtn.accent { border-color: rgba(168,85,247,0.35); color: var(--accent); background: rgba(168,85,247,0.1); }
.hbtn.accent:hover { background: rgba(168,85,247,0.18); }

/* SORT/VIEW CONTROLS */
.controls-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.3);
  flex-shrink: 0;
}

.sort-btn {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: none;
  border: 1px solid transparent;
  padding: 4px 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
}

.sort-btn:hover { color: var(--text); border-color: var(--border); }
.sort-btn.active { color: var(--accent); border-color: rgba(168,85,247,0.35); background: rgba(168,85,247,0.08); }

.view-toggle {
  margin-left: auto;
  display: flex;
  gap: 4px;
}

.view-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--dim);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  transition: all 0.15s;
  display: flex;
  align-items: center;
}

.view-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; }
.view-btn:hover { color: var(--muted); border-color: var(--border); }
.view-btn.active { color: var(--accent); border-color: rgba(168,85,247,0.35); background: rgba(168,85,247,0.08); }

.open-all-btn {
  margin-left: 8px;
}

/* CONTENT */
.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  scroll-behavior: smooth;
}

.content-scroll::-webkit-scrollbar { width: 4px; }
.content-scroll::-webkit-scrollbar-track { background: transparent; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}

.grid.compact {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 8px;
}

.grid.list {
  grid-template-columns: 1fr;
  gap: 6px;
}

/* SKELETON */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, rgba(255,255,255,0.06) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.2s infinite;
  border-radius: var(--r);
  border: 1px solid var(--border);
}

@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.skeleton-card { height: 130px; }
.skeleton-card.compact { height: 80px; }
.skeleton-card.list { height: 52px; }

/* CARD */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  padding: 16px;
  display: flex;
  flex-direction: column;
  text-decoration: none;
  transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
  animation: cardIn 0.3s ease both;
  cursor: pointer;
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.card:hover {
  background: var(--surface-hover);
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
}

/* Click animation */
.card.clicked {
  animation: clickPop 0.3s cubic-bezier(0.16,1,0.3,1);
}
@keyframes clickPop {
  0% { transform: scale(1); }
  40% { transform: scale(0.96); }
  100% { transform: scale(1); }
}

.card-glow {
  position: absolute;
  inset: 0;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(168,85,247,0.1), transparent 70%);
  transition: opacity 0.3s;
  pointer-events: none;
}

.card:hover .card-glow { opacity: 1; }

.card-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}

.site-favicon {
  width: 20px; height: 20px;
  border-radius: 3px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface);
}

.card-title {
  font-size: 13px;
  font-weight: 700;
  line-height: 1.3;
  flex: 1;
}

.card-actions {
  display: flex;
  gap: 4px;
  margin-left: auto;
  opacity: 0;
  transition: opacity 0.15s;
}

.card:hover .card-actions { opacity: 1; }

.card-url {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  margin-bottom: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

.card-tag {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--dim);
}

.click-count {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--dim);
  display: flex;
  align-items: center;
  gap: 3px;
}

.dead-badge {
  font-family: var(--mono);
  font-size: 9px;
  color: #ff4444;
  background: rgba(255,68,68,0.1);
  border: 1px solid rgba(255,68,68,0.2);
  padding: 1px 5px;
  border-radius: 3px;
}

/* ACTION ICON */
.aicon {
  width: 22px; height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}

.aicon:hover { color: var(--text); background: rgba(255,255,255,0.1); }
.aicon svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }

.aicon.fav.active { color: #fbbf24; }
.aicon.fav.active svg { fill: #fbbf24; stroke: #fbbf24; }
.aicon.pin.active { color: var(--accent3); }

/* LIST VIEW */
.grid.list .card {
  flex-direction: row;
  align-items: center;
  padding: 10px 14px;
}

.grid.list .card-header { margin-bottom: 0; flex: 1; min-width: 0; }
.grid.list .card-url { margin-bottom: 0; width: 160px; flex-shrink: 0; }
.grid.list .card-footer { border-top: none; padding-top: 0; margin-top: 0; margin-left: 12px; }
.grid.list .card-glow { display: none; }

/* COMPACT VIEW */
.grid.compact .card { padding: 12px; }
.grid.compact .card-url, .grid.compact .card-footer { display: none; }
.grid.compact .card-header { margin-bottom: 4px; }

/* TOOLTIP */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a1a;
  color: var(--text);
  font-size: 10px;
  white-space: nowrap;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  pointer-events: none;
  z-index: 200;
  font-family: var(--mono);
}



/* STATS VIEW */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 18px;
}

.stat-label {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 8px;
}

.stat-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--accent);
  line-height: 1;
}

.stat-sub {
  font-size: 11px;
  color: var(--dim);
  margin-top: 4px;
}

.top-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
}

.top-list-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.top-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  text-decoration: none;
  color: var(--text);
  transition: background 0.15s;
}

.top-item:hover { background: var(--surface-hover); }

.top-rank {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--dim);
  width: 20px;
  text-align: right;
  flex-shrink: 0;
}

.top-name { font-size: 13px; font-weight: 600; flex: 1; }

.top-bar-wrap { width: 80px; height: 3px; background: var(--surface-hover); border-radius: 2px; }
.top-bar { height: 100%; background: var(--accent); border-radius: 2px; }

.top-clicks {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  width: 32px;
  text-align: right;
}

/* VIEWS */
.view-section { display: none; }
.view-section.active { display: block; animation: fadeIn 0.25s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.modal-overlay.open { opacity: 1; pointer-events: all; }

.modal {
  background: #0e0e10;
  border: 1px solid var(--border-hover);
  border-radius: 10px;
  padding: 24px;
  width: 100%;
  max-width: 420px;
  margin: 16px;
  transform: scale(0.95);
  transition: transform 0.2s cubic-bezier(0.16,1,0.3,1);
}

.modal-overlay.open .modal { transform: scale(1); }

.modal-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 16px;
}

.modal-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 9px 12px;
  border-radius: var(--r);
  outline: none;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}

.modal-input:focus { border-color: var(--accent); }
.modal-input::placeholder { color: var(--dim); }

.modal-select {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  padding: 9px 12px;
  border-radius: var(--r);
  outline: none;
  margin-bottom: 16px;
  cursor: pointer;
}

.modal-select option { background: #0e0e10; }

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 700;
  padding: 8px 16px;
  border-radius: var(--r);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: all 0.15s;
}

.btn:hover { color: var(--text); border-color: var(--border-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 800; }
.btn.primary:hover { background: #b36ef5; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--text);
  color: #000;
  padding: 8px 14px;
  border-radius: var(--r);
  font-size: 12px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.16,1,0.3,1);
  z-index: 300;
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.toast svg { width: 12px; height: 12px; stroke: #000; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* BACK TO TOP */
.back-top {
  position: fixed;
  right: 24px;
  bottom: 24px;
  width: 36px; height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.2s;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
}

.back-top.visible { opacity: 1; pointer-events: all; }
.back-top:hover { color: var(--text); border-color: var(--accent); transform: translateY(-2px); }
.back-top svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }

/* KEYBOARD HINT */
.kbd-hint {
  position: fixed;
  right: 24px;
  top: calc(var(--header-h) + 60px);
  background: rgba(0,0,0,0.8);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
  z-index: 90;
  display: none;
  min-width: 180px;
}

.kbd-hint.visible { display: block; }
.kbd-hint-title { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.kbd-row { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; font-size: 11px; color: var(--dim); }
.kbd-row span { color: var(--muted); }
kbd { background: var(--surface); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-family: var(--mono); font-size: 9px; }

/* MOBILE NAV */
.mobile-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  background: rgba(6,6,8,0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  padding: 8px 0 env(safe-area-inset-bottom, 8px);
  z-index: 50;
  justify-content: space-around;
}

.mnav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-size: 9px;
  font-weight: 700;
  color: var(--dim);
  gap: 4px;
  padding: 6px 10px;
  cursor: pointer;
  transition: color 0.15s;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.mnav-item.active { color: var(--accent); }
.mnav-item svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; }

/* MATRIX MODE */
body.matrix-mode {
  --accent: #00ff41;
  --bg: #000300;
  --text: #00ff41;
  --muted: #006612;
  --dim: #003008;
  --surface: rgba(0,255,65,0.04);
  --surface-hover: rgba(0,255,65,0.08);
  --border: rgba(0,255,65,0.1);
  --border-hover: rgba(0,255,65,0.25);
}

body.matrix-mode .brand-name { color: var(--accent); text-shadow: 0 0 20px var(--accent); }
body.matrix-mode .card:hover { box-shadow: 0 0 20px rgba(0,255,65,0.15); }
body.matrix-mode .nav-item.active { background: rgba(0,255,65,0.06); }
body.matrix-mode .sort-btn.active,.body.matrix-mode .view-btn.active { border-color: rgba(0,255,65,0.3); background: rgba(0,255,65,0.06); }

/* NEON MODE */
body.neon-mode {
  --accent: #ff00ff;
  --accent2: #00ffff;
  --accent3: #ff6600;
  --surface: rgba(255,0,255,0.04);
  --border: rgba(255,0,255,0.12);
  --border-hover: rgba(255,0,255,0.3);
}

body.neon-mode .nav-item.active { background: rgba(255,0,255,0.06); }
body.neon-mode .card:hover { box-shadow: 0 0 20px rgba(255,0,255,0.2), 0 0 60px rgba(0,255,255,0.1); }
body.neon-mode .search-input:focus { border-color: var(--accent2); box-shadow: 0 0 0 2px rgba(0,255,255,0.1); }

/* RANDOM SITE BUTTON */
.random-btn {
  animation: pulse 2s ease infinite;
}
@keyframes pulse {
  0%,100%{box-shadow:none}
  50%{box-shadow:0 0 12px rgba(168,85,247,0.4)}
}

/* IMPORT/EXPORT */
.io-section { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
.io-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 12px; }

/* EMPTY STATE */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 48px;
  color: var(--dim);
}
.empty-state svg { width: 32px; height: 32px; stroke: var(--dim); stroke-width: 1; fill: none; margin-bottom: 12px; }
.empty-state p { font-size: 13px; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-nav { display: flex; }
  .main { padding-bottom: 68px; }
  header { padding: 0 14px; }
  .content-scroll { padding: 14px; }
  .search-wrap { width: 140px; }
  .hbtn span { display: none; }
  .hbtn { padding: 6px 8px; }
  .controls-bar { padding: 8px 14px; overflow-x: auto; }
  .grid { grid-template-columns: 1fr; }
  .grid.list .card-url { display: none; }
  .card-actions { opacity: 1; }
  .back-top { bottom: 80px; }
}
</style>

// ─── FUZZY MATCH ─────────────────────────────────────────────────────────────
function fuzzyMatch(str, query) {
  if (!query) return true;
  str = str.toLowerCase();
  query = query.toLowerCase();
  if (str.includes(query)) return true;
  let si = 0;
  for (let qi = 0; qi < query.length; qi++) {
    while (si < str.length && str[si] !== query[qi]) si++;
    if (si >= str.length) return false;
    si++;
  }
  return true;
}

// ─── APP ─────────────────────────────────────────────────────────────────────
const app = {
  currentTab: 'games',
  viewMode: 'list',
  sortMode: 'default',
  themeIdx: 0,
  favorites: [],
  pinned: [],
  clicks: {}, // {id: count}
  db: null,
  customSites: [],

  init() {
    // Load state
    this.favorites = JSON.parse(localStorage.getItem('dachub_favs_v2') || '[]');
    this.pinned = JSON.parse(localStorage.getItem('dachub_pinned') || '[]');
    this.clicks = JSON.parse(localStorage.getItem('dachub_clicks') || '{}');
    this.viewMode = localStorage.getItem('dachub_view') || 'list';
    this.sortMode = localStorage.getItem('dachub_sort') || 'default';
    this.themeIdx = parseInt(localStorage.getItem('dachub_theme') || '0');
    this.customSites = JSON.parse(localStorage.getItem('dachub_custom_sites') || '[]');

    // Merge custom into db
    this.db = JSON.parse(JSON.stringify(DEFAULT_DB));
    this.customSites.forEach(s => {
      if (this.db[s.cat]) this.db[s.cat].push({id: s.id, name: s.name, url: s.url});
    });

    this.applyTheme();
    this.loadBackground();
    this.initParticles();
    this.initKeyboard();
    this.initScroll();
    this.renderAll();
    this.setTab('games');
    this.updateSidebarStats();
  },

  applyTheme() {
    document.body.classList.remove(...THEMES);
    if (this.themeIdx > 0) document.body.classList.add(THEMES[this.themeIdx]);
  },

  cycleTheme() {
    this.themeIdx = (this.themeIdx + 1) % THEMES.length;
    localStorage.setItem('dachub_theme', this.themeIdx);
    this.applyTheme();
    const names = ['Default','Matrix','Neon'];
    this.showToast(`Theme: ${names[this.themeIdx]}`);
  },

  loadBackground() {
    const bg = localStorage.getItem('dachub_custom_bg');
    document.body.style.backgroundImage = `url(${bg || DEFAULT_BG})`;
  },

  handleBgUpload(input) {
    if (!input.files?.[0]) return;
    const r = new FileReader();
    r.onload = e => {
      localStorage.setItem('dachub_custom_bg', e.target.result);
      document.body.style.backgroundImage = `url(${e.target.result})`;
      this.showToast('Background updated');
    };
    r.readAsDataURL(input.files[0]);
  },

  // ─── KEYBOARD ──────────────────────────────────────────────────────────────
  initKeyboard() {
    document.addEventListener('keydown', e => {
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); }
      if (e.key === 'r' || e.key === 'R') this.openRandom();
      if (e.key === 'f' || e.key === 'F') this.setTab('favorites');
      if (e.key === 'Escape') this.closeAddModal();
    });
  },

  // ─── SCROLL ────────────────────────────────────────────────────────────────
  initScroll() {
    const sc = document.getElementById('contentScroll');
    const btn = document.getElementById('backTop');
    sc.addEventListener('scroll', () => {
      btn.classList.toggle('visible', sc.scrollTop > 300);
    });
  },

  scrollTop() {
    document.getElementById('contentScroll').scrollTo({top: 0, behavior: 'smooth'});
  },

  // ─── PARTICLES ─────────────────────────────────────────────────────────────
  initParticles() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, pts;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function makePoints() {
      pts = Array.from({length: 60}, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 1.5 + 0.5
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const isDark = true;
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(168,85,247,0.5)';
        ctx.fill();
      });
      // Lines
      for (let i = 0; i < pts.length; i++) {
        for (let j = i+1; j < pts.length; j++) {
          const dx = pts[i].x - pts[j].x;
          const dy = pts[i].y - pts[j].y;
          const d = Math.sqrt(dx*dx + dy*dy);
          if (d < 100) {
            ctx.beginPath();
            ctx.moveTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[j].x, pts[j].y);
            ctx.strokeStyle = `rgba(168,85,247,${0.1 * (1 - d/100)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(draw);
    }

    resize();
    makePoints();
    draw();
    window.addEventListener('resize', () => { resize(); makePoints(); });
  },

  // ─── FAVICON ───────────────────────────────────────────────────────────────
  favicon(url) {
    try {
      const u = new URL(url);
      return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
    } catch { return ''; }
  },

  // ─── CARD RENDER ───────────────────────────────────────────────────────────
  createCard(item, cat) {
    const clean = item.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    const isFav = this.favorites.includes(item.id);
    const isPinned = this.pinned.includes(item.id);
    const clicks = this.clicks[item.id] || 0;
    const fav = this.favicon(item.url);

    return `<div class="card" id="card-${item.id}" onclick="app.handleCardClick('${item.id}','${item.url}', this)">
      <div class="card-glow"></div>
      <div class="card-header">
        <img class="site-favicon" src="${fav}" alt="" onerror="this.style.display='none'">
        <div class="card-title">${item.name}</div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <div class="aicon fav ${isFav?'active':''}" onclick="app.toggleFav('${item.id}',event)" data-tip="${isFav?'Remove fav':'Add fav'}">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="aicon pin ${isPinned?'active':''}" onclick="app.togglePin('${item.id}',event)" data-tip="Pin">
            <svg viewBox="0 0 24 24"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
          </div>
          <div class="aicon" onclick="app.copyLink('${item.url}',event)" data-tip="Copy link">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </div>
        </div>
      </div>
      <div class="card-url">${clean}</div>
      <div class="card-footer">
        <span class="card-tag">${cat === 'favorites' ? 'saved' : cat}</span>
        <span class="click-count">
          <svg style="width:9px;height:9px;stroke:var(--dim);stroke-width:1.5;fill:none" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          ${clicks}
        </span>
      </div>
    </div>`;
  },

  handleCardClick(id, url, el) {
    // Animate
    el.classList.add('clicked');
    setTimeout(() => el.classList.remove('clicked'), 300);

    // Track click
    this.clicks[id] = (this.clicks[id] || 0) + 1;
    localStorage.setItem('dachub_clicks', JSON.stringify(this.clicks));
    this.updateSidebarStats();

    // Open after brief delay for animation
    setTimeout(() => window.open(url, '_blank'), 100);
  },

  // ─── FAVORITES ─────────────────────────────────────────────────────────────
  toggleFav(id, e) {
    e.stopPropagation();
    const idx = this.favorites.indexOf(id);
    if (idx === -1) { this.favorites.push(id); this.showToast('⭐ Added to favorites'); }
    else { this.favorites.splice(idx, 1); this.showToast('Removed from favorites'); }
    localStorage.setItem('dachub_favs_v2', JSON.stringify(this.favorites));
    this.render(this.currentTab, document.getElementById('searchInput').value);
    this.updateSidebarStats();
    this.updateNavBadges();
  },

  togglePin(id, e) {
    e.stopPropagation();
    const idx = this.pinned.indexOf(id);
    if (idx === -1) { this.pinned.push(id); this.showToast('📌 Pinned'); }
    else { this.pinned.splice(idx, 1); this.showToast('Unpinned'); }
    localStorage.setItem('dachub_pinned', JSON.stringify(this.pinned));
    this.render(this.currentTab, document.getElementById('searchInput').value);
  },

  openAllFavs() {
    const allItems = Object.values(this.db).flat();
    const favItems = allItems.filter(i => this.favorites.includes(i.id));
    if (!favItems.length) { this.showToast('No favorites to open'); return; }
    const ok = confirm(`Open ${favItems.length} favorites in new tabs?`);
    if (ok) favItems.forEach(i => window.open(i.url, '_blank'));
  },

  exportFavs() {
    const allItems = Object.values(this.db).flat();
    const favItems = allItems.filter(i => this.favorites.includes(i.id));
    const blob = new Blob([JSON.stringify(favItems, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dachub-favorites.json';
    a.click();
    this.showToast('Exported!');
  },

  // ─── SEARCH / SUGGESTIONS ──────────────────────────────────────────────────
  showSuggestions(val) {
    if (!val || val.length < 2) { this.hideSuggestions(); return; }
    const allItems = [];
    Object.entries(this.db).forEach(([cat, arr]) => arr.forEach(i => allItems.push({...i, cat})));
    const matches = allItems.filter(i => fuzzyMatch(i.name, val) || fuzzyMatch(i.url, val)).slice(0, 6);
    const el = document.getElementById('suggestions');
    if (!matches.length) { this.hideSuggestions(); return; }
    el.innerHTML = matches.map(i => `
      <div class="suggestion-item" onclick="app.handleCardClick('${i.id}','${i.url}',{classList:{add:()=>{},remove:()=>{}}})">
        <img src="${this.favicon(i.url)}" alt="" onerror="this.style.display='none'" style="width:14px;height:14px;border-radius:2px">
        <span class="suggestion-name">${i.name}</span>
        <span class="suggestion-cat">${i.cat}</span>
      </div>`).join('');
    el.classList.add('visible');
  },

  hideSuggestions() {
    document.getElementById('suggestions').classList.remove('visible');
  },

  // ─── SORT / VIEW ───────────────────────────────────────────────────────────
  setSort(mode, btn) {
    this.sortMode = mode;
    localStorage.setItem('dachub_sort', mode);
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    this.render(this.currentTab, document.getElementById('searchInput').value);
  },

  setViewMode(mode, btn) {
    this.viewMode = mode;
    localStorage.setItem('dachub_view', mode);
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.grid').forEach(g => {
      g.className = `grid${mode !== 'normal' ? ' ' + mode : ''}`;
    });
    this.render(this.currentTab, document.getElementById('searchInput').value);
  },

  sortItems(items) {
    const arr = [...items];
    if (this.sortMode === 'name') return arr.sort((a,b) => a.name.localeCompare(b.name));
    if (this.sortMode === 'clicks') return arr.sort((a,b) => (this.clicks[b.id]||0) - (this.clicks[a.id]||0));
    if (this.sortMode === 'favorites') {
      return arr.sort((a,b) => {
        const af = this.favorites.includes(a.id) ? -1 : 0;
        const bf = this.favorites.includes(b.id) ? -1 : 0;
        return af - bf;
      });
    }
    // default: pinned first
    return arr.sort((a,b) => {
      const ap = this.pinned.includes(a.id) ? -1 : 0;
      const bp = this.pinned.includes(b.id) ? -1 : 0;
      return ap - bp;
    });
  },

  // ─── RENDER ────────────────────────────────────────────────────────────────
  render(category, filter = '') {
    if (category === 'stats') return;
    const container = document.getElementById(`grid-${category}`);
    if (!container) return;

    // Show skeleton first
    const skClass = this.viewMode === 'compact' ? 'compact' : this.viewMode === 'list' ? 'list' : '';
    container.innerHTML = Array(4).fill(`<div class="skeleton skeleton-card ${skClass}"></div>`).join('');

    setTimeout(() => {
      let data = [];
      if (category === 'favorites') {
        Object.entries(this.db).forEach(([cat, arr]) => {
          arr.filter(i => this.favorites.includes(i.id)).forEach(i => data.push({...i, cat}));
        });
      } else {
        data = (this.db[category] || []).map(i => ({...i, cat: category}));
      }

      // Fuzzy filter
      if (filter) {
        data = data.filter(i => fuzzyMatch(i.name, filter) || fuzzyMatch(i.url, filter));
      }

      data = this.sortItems(data);

      // Update count
      document.getElementById('countBadge').textContent = data.length;

      // Update nav badge
      const nb = document.getElementById(`nbadge-${category}`);
      if (nb) nb.textContent = data.length;

      if (!data.length) {
        container.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><p>No results found</p></div>`;
        return;
      }

      // Apply view mode class
      container.className = `grid${this.viewMode !== 'normal' ? ' ' + this.viewMode : ''}`;

      container.innerHTML = data.map((i, idx) => {
        const html = this.createCard(i, i.cat || category);
        return html.replace('animation: cardIn 0.3s ease both', `animation: cardIn 0.3s ${idx * 0.04}s ease both`);
      }).join('');
    }, 80);
  },

  renderAll(filter = '') {
    Object.keys(this.db).forEach(k => this.render(k, filter));
    this.render('favorites', filter);
  },

  renderStats() {
    const allItems = Object.values(this.db).flat();
    const total = allItems.length;
    const favCount = this.favorites.length;
    const totalClicks = Object.values(this.clicks).reduce((a,b) => a+b, 0);

    const mostUsedCat = Object.entries(this.db).sort((a,b) => b[1].length - a[1].length)[0];

    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card"><div class="stat-label">Total Sites</div><div class="stat-value">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Favorites</div><div class="stat-value">${favCount}</div></div>
      <div class="stat-card"><div class="stat-label">Total Clicks</div><div class="stat-value">${totalClicks}</div></div>
      <div class="stat-card"><div class="stat-label">Biggest Category</div><div class="stat-value" style="font-size:18px">${mostUsedCat[0]}</div><div class="stat-sub">${mostUsedCat[1].length} sites</div></div>
    `;

    const ranked = allItems
      .filter(i => this.clicks[i.id])
      .sort((a,b) => (this.clicks[b.id]||0) - (this.clicks[a.id]||0))
      .slice(0, 10);

    const maxClicks = ranked[0] ? this.clicks[ranked[0].id] : 1;

    document.getElementById('topList').innerHTML = `
      <div class="top-list-header">🔥 Most Clicked</div>
      ${ranked.length ? ranked.map((i, idx) => `
        <a class="top-item" href="${i.url}" target="_blank" onclick="app.handleCardClick('${i.id}','${i.url}',{classList:{add:()=>{},remove:()=>{}}});event.preventDefault()">
          <span class="top-rank">#${idx+1}</span>
          <img src="${this.favicon(i.url)}" alt="" onerror="this.style.display='none'" style="width:16px;height:16px;border-radius:2px">
          <span class="top-name">${i.name}</span>
          <div class="top-bar-wrap"><div class="top-bar" style="width:${Math.round((this.clicks[i.id]/maxClicks)*100)}%"></div></div>
          <span class="top-clicks">${this.clicks[i.id]}</span>
        </a>`).join('') : '<div style="padding:20px;text-align:center;color:var(--dim);font-size:12px">No clicks yet. Start exploring!</div>'}
    `;
  },

  // ─── NAVIGATION ────────────────────────────────────────────────────────────
  setTab(tabId, e) {
    if (e) e.preventDefault();
    this.currentTab = tabId;

    const labels = {games:'Games',streaming:'Streaming',anime:'Anime',tvapks:'APKs',favorites:'Favorites',stats:'Stats'};
    document.getElementById('pageTitle').textContent = labels[tabId] || tabId;

    // Active states
    document.querySelectorAll('[data-tab]').forEach(el => el.classList.toggle('active', el.dataset.tab === tabId));

    // Views
    document.querySelectorAll('.view-section').forEach(el => {
      el.classList.remove('active');
    });
    const target = document.getElementById(`view-${tabId}`);
    if (target) target.classList.add('active');

    // Count badge visibility
    const hideBadge = tabId === 'stats';
    document.getElementById('countBadge').style.display = hideBadge ? 'none' : '';

    // Open All Favs button
    document.getElementById('openAllBtn').style.display = tabId === 'favorites' ? '' : 'none';

    // Controls bar visibility
    document.querySelector('.controls-bar').style.display = tabId === 'stats' ? 'none' : '';

    if (tabId === 'stats') this.renderStats();
    else this.render(tabId, document.getElementById('searchInput').value);
  },

  handleSearch(val) {
    this.showSuggestions(val);
    this.render(this.currentTab, val);
  },

  // ─── ADD SITE ──────────────────────────────────────────────────────────────
  openAddModal() {
    document.getElementById('addModal').classList.add('open');
  },

  closeAddModal() {
    document.getElementById('addModal').classList.remove('open');
  },

  closeModal(e) {
    if (e.target === document.getElementById('addModal')) this.closeAddModal();
  },

  addSite() {
    const name = document.getElementById('newName').value.trim();
    const url = document.getElementById('newUrl').value.trim();
    const cat = document.getElementById('newCat').value;
    if (!name || !url) { this.showToast('Fill in all fields'); return; }
    const site = { id: 'c' + Date.now(), name, url, cat };
    this.customSites.push(site);
    localStorage.setItem('dachub_custom_sites', JSON.stringify(this.customSites));
    this.db[cat].push({id: site.id, name, url});
    document.getElementById('newName').value = '';
    document.getElementById('newUrl').value = '';
    this.closeAddModal();
    this.showToast('Site added!');
    this.render(cat, '');
    this.updateNavBadges();
    this.updateSidebarStats();
  },

  // ─── UTILITIES ─────────────────────────────────────────────────────────────
  copyLink(url, e) {
    e.stopPropagation();
    navigator.clipboard.writeText(url).then(() => this.showToast('Link copied!'));
  },

  openRandom() {
    const cats = Object.keys(this.db);
    const cat = cats[Math.floor(Math.random() * cats.length)];
    const items = this.db[cat];
    const item = items[Math.floor(Math.random() * items.length)];
    window.open(item.url, '_blank');
    this.showToast(`🎲 ${item.name}`);
  },

  showToast(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  },

  updateSidebarStats() {
    const total = Object.values(this.db).flat().length;
    const totalClicks = Object.values(this.clicks).reduce((a,b) => a+b, 0);
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-favs').textContent = this.favorites.length;
    document.getElementById('stat-clicks').textContent = totalClicks;
  },

  updateNavBadges() {
    Object.keys(this.db).forEach(cat => {
      const el = document.getElementById(`nbadge-${cat}`);
      if (el) el.textContent = this.db[cat].length;
    });
    const favEl = document.getElementById('nbadge-favorites');
    if (favEl) favEl.textContent = this.favorites.length;
  }
};

window.addEventListener('DOMContentLoaded', () => app.init());
</script>
